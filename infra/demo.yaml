apiVersion: v1
kind: Namespace
metadata:
  name: heal-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: heal-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo}
      annotations: {heal/revision: good}
    spec:
      containers:
        - name: demo
          image: heallab-demo:local
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          env:
            - {name: DEMO_FAULTS, value: 'true'}
            - {name: FAULT, value: none}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata: {name: demo, namespace: heal-demo}
spec:
  type: NodePort
  selector: {app: demo}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
